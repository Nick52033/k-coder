[package]
name = "k-coder"
version = "0.10.0"
description = "本地优先的编程智能体桌面应用"
authors = ["k-Coder contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "k_coder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []

# 在 Windows 上跑 `tauri::test` 的 mock runtime 测试。
#
# 开启后 build.rs 会给**所有**目标追加 `/MANIFEST:EMBED` +
# `/MANIFESTINPUT:windows/tests.manifest`，给测试二进制补上 Common Controls v6 声明。
#
# 为什么需要：mock runtime 会把窗口层链进测试二进制，从而导入
# `comctl32.dll!TaskDialogIndirect`（Common Controls v6 专有导出）。二进制缺少 v6 声明时
# 加载器会解析到 System32 下的 v5.82，报 `STATUS_ENTRYPOINT_NOT_FOUND`（`0xc0000139`），
# 测试进程在跑任何用例之前就死掉——表现为 `cargo test --lib` 无输出直接失败。
#
# 为什么做成可选：`cargo:rustc-link-arg` 是唯一能覆盖 lib 单元测试目标的链接参数作用域
# （`cargo:rustc-link-arg-tests` 只作用于 `tests/*.rs`，对 lib 单元测试无效），而它同时
# 也作用于 bin。应用二进制的清单由 `tauri_build` 经 `cargo:rustc-link-arg-bins` 注入，
# 叠加第二份清单有冲突风险，所以默认关闭，正常构建完全不受影响。
#
# 用法：cargo test --lib --features mock-runtime-tests
mock-runtime-tests = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
async-trait = "0.1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
base64 = "0.22"
calamine = "0.36.1"
chromiumoxide = "0.9.1"
futures-util = "0.3"
jsonschema = { version = "0.48.1", default-features = false }
portable-pty = "0.9.0"
pdf-extract = "0.12.0"
quick-xml = "0.41.0"
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11.0"
similar = "3.1.1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "8.4.0", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.29"

# ---------------------------------------------------------------------------
# 构建体积控制
#
# 背景：dev 档默认 debug = 2（完整 DWARF），而本项目依赖图很大
# （tauri / chromiumoxide / rusqlite(bundled) / pdf-extract / image …），
# 曾把 target/ 撑到 83 GB：debug/deps 19.8 GB、debug/incremental 33 GB、
# debug/build 1.9 GB（每个依赖的 build script 都会带一份 .pdb）。
#
# 策略：
#   - 本地 crate 用 debug = 1：保留行号表，断点与单步照常可用，砍掉完整 DWARF；
#   - 第三方依赖 debug = false：极少需要单步进依赖源码，调试信息纯属浪费；
#   - build-override（build script 与 proc-macro）同样关掉：它们只在构建期运行。
#
# 代价：依赖内部栈帧的 backtrace 会缺文件/行号（panic 消息本身不受影响）。
# 若确实需要单步调试依赖源码，把对应 debug 临时改回 2 即可，重新编译一轮即可恢复。
# ---------------------------------------------------------------------------
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
