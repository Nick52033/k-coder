<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#16171d" media="(prefers-color-scheme: dark)" />
<title>k-Coder 手机控制</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-alt: #eef0f4;
    --border: #dfe2e9;
    --text: #14161a;
    --muted: #626a79;
    --accent: #185fa5;
    --accent-soft: #e7f1fb;
    --accent-text: #0f4478;
    --danger: #a32d2d;
    --danger-soft: #fcebeb;
    --warning: #854f0b;
    --warning-soft: #faeeda;
    --success: #0f6e56;
    --success-soft: #e1f5ee;
    --radius: 14px;
    --composer-h: 84px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151b;
      --surface: #1e1f27;
      --surface-alt: #262832;
      --border: #343743;
      --text: #e8eaf2;
      --muted: #9ba2b4;
      --accent: #85b7eb;
      --accent-soft: #1c2a3c;
      --accent-text: #cfe4f9;
      --danger: #f09595;
      --danger-soft: #3a2020;
      --warning: #f0c070;
      --warning-soft: #3a2f16;
      --success: #7fd3b4;
      --success-soft: #16302a;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior-y: none;
  }
  /* 顶部栏：吸顶，带上刘海安全区。 */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface);
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: saturate(160%) blur(12px);
    -webkit-backdrop-filter: saturate(160%) blur(12px);
    border-bottom: 1px solid var(--border);
    padding: calc(8px + var(--safe-top)) 14px 8px;
    display: flex; align-items: center; gap: 9px;
  }
  header h1 {
    font-size: 16px; font-weight: 600; margin: 0; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .status-dot.online { background: var(--success); }
  .status-dot.connecting { background: var(--warning); }
  .status-dot.offline { background: var(--danger); }
  .status-text { font-size: 12px; color: var(--muted); flex: none; }

  main {
    padding: 12px 14px calc(var(--composer-h) + 14px + var(--safe-bottom));
    max-width: 720px; margin: 0 auto;
  }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 10px; }
  .card h2 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.spread { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }

  button {
    font: inherit; border-radius: 11px; border: 1px solid var(--border);
    background: var(--surface-alt); color: var(--text); padding: 9px 14px;
    min-height: 42px; cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  button.success { background: var(--success-soft); border-color: var(--success); color: var(--success); }
  button.ghost { background: transparent; }
  button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-alt);
    color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
  .pill.running { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
  .pill.approval { background: var(--warning-soft); color: var(--warning); border-color: transparent; }

  .banner { border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; font-size: 14px; }
  .banner.error { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); }
  .banner.info { background: var(--accent-soft); color: var(--accent-text); border: 1px solid var(--accent); }
  .banner.warning { background: var(--warning-soft); color: var(--warning); border: 1px solid var(--warning); }
  .hidden { display: none !important; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .field label { font-size: 13px; color: var(--muted); }
  input[type=text], input[type=number] { font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 11px; padding: 10px; min-height: 42px; width: 100%; }
  .choice { display: flex; flex-direction: column; gap: 6px; }
  .choice button { text-align: left; }

  /* ---- 会话列表 ---- */
  .thread { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 8px; }
  .thread .thread-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread .thread-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  /* 项目分组内的会话收进同一张卡片靠分隔线区分层级。
     注意必须用 `border-bottom-width` 而不是 `border-width` 简写：简写会把上边框也从
     0 改成 1px，而 `.thread` 本来没有上边框，多出来的 1px 会改变卡片的实际高度。
     `--composer-h` 由 `composer.offsetHeight` 取整写入，正文区底距按它计算，
     于是这 1px 会让「正文让出的空间」与「输入区真实高度」之差越过既有断言的阈值。 */
  .project-body .thread { border-radius: 0; border-bottom-width: 1px; border-top-width: 0; margin-bottom: 0; }
  .project-body .thread:last-child { border-bottom-width: 0; }

  .project { margin-bottom: 10px; }
  .project-head { display: flex; align-items: center; gap: 8px; padding: 4px 2px 6px; }
  .project-toggle { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0;
    background: none; border: 0; padding: 0; text-align: left; color: inherit;
    font: inherit; font-weight: 600; }
  .project-toggle .chevron { display: inline-block; transition: transform .15s;
    color: var(--muted); flex: none; }
  .project-toggle[aria-expanded="true"] .chevron { transform: rotate(90deg); }
  .project-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-count { font-size: 12px; color: var(--muted); background: var(--surface-alt);
    border-radius: 999px; padding: 1px 8px; flex: none; }
  .project-fold { font-size: 12px; color: var(--muted); flex: none; }
  .project-body { background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; }
  .project-empty { color: var(--muted); font-size: 13px; padding: 12px 14px; }

  /* ---- 对话 ---- */
  .chatbar {
    position: sticky; top: var(--header-h, 45px); z-index: 15;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 0 8px; margin-bottom: 4px;
    /* 必须是不透明背景：用渐隐的话，滚到下面的长文本会从半透明处透出来。 */
    background: var(--bg);
  }
  .chatbar-title { flex: 1; min-width: 0; font-weight: 600; font-size: 15px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #timeline { display: flex; flex-direction: column; gap: 10px; }

  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg.agent { justify-content: flex-start; }
  .bubble { max-width: 88%; padding: 10px 13px; border-radius: 15px;
    white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble.user { background: var(--accent-soft); color: var(--accent-text); border-bottom-right-radius: 5px; }
  .bubble.agent { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
  .bubble.error { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); max-width: 100%; }
  .bubble.note { background: transparent; border: 1px dashed var(--border); color: var(--muted); font-size: 13px; max-width: 100%; }
  .bubble.streaming::after {
    content: "▍"; color: var(--accent); margin-left: 1px;
    animation: caret 1.1s steps(1, end) infinite;
  }
  @keyframes caret { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .bubble.streaming::after { animation: none; } }

  details.tool, .change {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0; overflow: hidden;
  }
  details.tool > summary {
    display: flex; align-items: center; gap: 8px; padding: 11px 13px;
    cursor: pointer; font-size: 13.5px; color: var(--text); list-style: none;
  }
  details.tool > summary::-webkit-details-marker { display: none; }
  details.tool > summary .tool-name { flex: 1; min-width: 0; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details.tool > summary .tool-name code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px; color: var(--muted); }
  details.tool > summary .chevron { color: var(--muted); font-size: 11px; transition: transform 0.15s ease; }
  details.tool[open] > summary .chevron { transform: rotate(90deg); }
  details.tool pre {
    margin: 0; padding: 0 13px 12px; font-size: 12.5px; line-height: 1.5;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 42vh; overflow-y: auto; color: var(--text);
  }
  .change { padding: 10px 13px; font-size: 13.5px; }
  .change .change-files { color: var(--muted); font-size: 12.5px; margin-top: 4px; overflow-wrap: anywhere; }

  .todo-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 13px; }
  .todo-card h2 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 500; }
  .todo { display: flex; gap: 8px; font-size: 13.5px; padding: 2px 0; }
  .todo .mark { flex: none; }
  .todo[data-status="completed"] { color: var(--muted); text-decoration: line-through; }
  .todo[data-status="in_progress"] { color: var(--accent-text); font-weight: 500; }

  /* ---- 输入区 ---- */
  .composer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--surface);
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: saturate(160%) blur(12px);
    -webkit-backdrop-filter: saturate(160%) blur(12px);
    border-top: 1px solid var(--border);
    padding: 8px 12px calc(8px + var(--safe-bottom));
  }
  .composer-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; }
  .composer textarea {
    flex: 1; min-width: 0; resize: none; font: inherit; color: var(--text);
    background: var(--surface-alt); border: 1px solid var(--border); border-radius: 16px;
    padding: 9px 12px; max-height: 132px; overflow-y: auto; line-height: 1.5;
  }
  .composer textarea:disabled { opacity: 0.6; }
  .composer .send, .composer .stop { flex: none; border-radius: 16px; padding: 0 16px; min-height: 42px; }
  .composer .stop { display: none; }
  .composer[data-running="true"] .send { display: none; }
  .composer[data-running="true"] .stop { display: block; }

  footer { font-size: 12px; color: var(--muted); text-align: center; padding: 4px 0 12px; }

  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>
</head>
<body>
<header>
  <span class="status-dot" id="dot"></span>
  <h1 id="title">k-Coder</h1>
  <span class="status-text" id="statusText">连接中…</span>
</header>

<main>
  <div id="banner" class="banner hidden"></div>

  <section id="pairSection" class="hidden">
    <div class="card">
      <h2>设备配对</h2>
      <p class="muted" id="pairHint">正在读取配对信息…</p>
      <div class="field">
        <label for="deviceName">设备名称</label>
        <input type="text" id="deviceName" placeholder="例如：我的手机" autocomplete="off" />
      </div>
      <div class="field">
        <label for="pairCode">电脑屏幕上显示的 6 位校验码</label>
        <input type="text" id="pairCode" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off" />
      </div>
      <button class="primary" id="pairButton">提交配对请求</button>
      <p class="muted" id="pairProgress" style="margin-top:10px"></p>
    </div>
  </section>

  <section id="threadsSection" class="hidden">
    <div class="row spread" style="margin-bottom:8px">
      <strong>会话</strong>
      <button id="refreshThreads">刷新</button>
    </div>
    <div id="threadList"></div>
  </section>

  <section id="chatSection" class="hidden">
    <div class="chatbar">
      <button id="backToThreads" class="ghost">← 返回</button>
      <div class="chatbar-title">
        <span id="chatTitle">会话</span>
        <div class="muted" id="chatMeta"></div>
      </div>
      <span class="pill" id="turnState">空闲</span>
      <button id="reloadThread" class="ghost" title="重新拉取会话">↻</button>
    </div>
    <div id="timeline"></div>
  </section>
</main>

<section id="composer" class="composer hidden">
  <div class="composer-inner">
    <textarea id="input" placeholder="给 k-Coder 发消息…" rows="1"></textarea>
    <button id="interruptButton" class="stop danger">停止</button>
    <button id="sendButton" class="send primary">发送</button>
  </div>
</section>

<script>
"use strict";
(function () {
  const PROTOCOL_VERSION = 1;
  const STORAGE_KEY = "k-coder-mobile-credentials";
  const MAX_BACKOFF_MS = 15000;
  /** 单个条目在手机上保留的最大字符数。超出后只保留末尾，避免长 Turn 撑爆内存。 */
  const MAX_ENTRY_CHARS = 32000;
  /** 工具输出流的上限。与服务端 `events::MAX_TOOL_RESULT_CHARS` 对齐，
   *  避免手机端靠命令行增量绕过结果长度约束。 */
  const MAX_TOOL_CHARS = 1024;
  /** 心跳间隔。用来在切后台/隧道抖动后尽早发现死连接，而不是等用户手动刷新。 */
  const HEARTBEAT_MS = 25000;
  /** 超过这个时间没有任何服务端消息，就认为连接已经不可用。 */
  const STALE_MS = 80000;

  const state = {
    credentials: null,
    socket: null,
    ready: false,
    initialized: false,
    accessToken: null,
    tokenExpiresAt: 0,
    backoff: 1000,
    requestSeq: 0,
    pending: new Map(),
    view: "threads",
    threads: [],
    projects: [],
    /** 已折叠的项目键。默认全部展开：手机上项目数量少，折叠反而多一步。 */
    collapsedProjects: new Set(),
    activeThreadId: null,
    activeTurnId: null,
    subscribed: new Map(),
    thread: null,
    streamingKey: null,
    draft: "",
    pairing: null,
    pairingTimer: null,
    heartbeatTimer: null,
    lastMessageAtMs: 0,
    follow: true,
  };

  const el = (id) => document.getElementById(id);
  const dot = el("dot");
  const statusText = el("statusText");
  const banner = el("banner");
  const input = el("input");
  const composer = el("composer");

  function showBanner(kind, text) {
    banner.className = "banner " + kind;
    banner.textContent = text;
  }
  function hideBanner() {
    banner.className = "banner hidden";
  }

  function loadCredentials() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || !parsed.deviceId || !parsed.deviceSecret) return null;
      return parsed;
    } catch (error) {
      return null;
    }
  }
  function saveCredentials(credentials) {
    state.credentials = credentials;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(credentials));
  }
  function clearCredentials() {
    localStorage.removeItem(STORAGE_KEY);
    state.credentials = null;
  }

  function setConnection(kind, text) {
    dot.className = "status-dot " + kind;
    statusText.textContent = text;
  }

  function wsUrl() {
    const scheme = location.protocol === "https:" ? "wss:" : "ws:";
    return scheme + "//" + location.host + "/ws";
  }

  function nextRequestId() {
    state.requestSeq += 1;
    return "m" + Date.now().toString(36) + "-" + state.requestSeq;
  }

  function call(method, params, options) {
    const opts = options || {};
    return new Promise((resolve, reject) => {
      const socket = state.socket;
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        reject(new Error("尚未连接到电脑"));
        return;
      }
      if (!state.ready && method !== "initialize" && method !== "initialized" && method !== "auth/refresh") {
        reject(new Error("连接尚未就绪"));
        return;
      }
      const id = nextRequestId();
      const timeout = setTimeout(() => {
        state.pending.delete(id);
        reject(new Error("请求超时"));
      }, opts.timeoutMs || 20000);
      state.pending.set(id, {
        resolve: (value) => { clearTimeout(timeout); resolve(value); },
        reject: (error) => { clearTimeout(timeout); reject(error); },
      });
      socket.send(JSON.stringify({ jsonrpc: "2.0", id: id, method: method, params: params || {} }));
    });
  }

  function send(method, params) {
    if (!state.socket || state.socket.readyState !== WebSocket.OPEN) return;
    state.socket.send(JSON.stringify({ jsonrpc: "2.0", method: method, params: params || {} }));
  }

  function notify(message) {
    showBanner("error", message);
    setTimeout(hideBanner, 6000);
  }

  function describeError(error) {
    const data = (error && error.data) || {};
    const kind = data.kind || "error";
    const messages = {
      unauthorized: "认证失败，需要重新配对",
      forbidden: "当前设备没有这个权限",
      not_found: "目标已不存在",
      stale_request: "这个请求已经过期，请刷新后重试",
      rate_limited: "操作太频繁，请稍后再试",
      server_overloaded: "电脑端正忙，请稍后再试",
      resume_required: "事件游标已过期，已重新读取会话",
      unsupported_capability: "这个能力尚未对手机开放",
      internal_error: "电脑端处理失败",
    };
    if (kind === "unauthorized" && state.credentials) {
      clearCredentials();
    }
    return messages[kind] || (error && error.message) || "未知错误";
  }

  // ---- 连接与协议 ----

  function connect() {
    if (state.socket && (state.socket.readyState === WebSocket.OPEN || state.socket.readyState === WebSocket.CONNECTING)) {
      return;
    }
    setConnection("connecting", "连接中…");
    let socket;
    try {
      socket = new WebSocket(wsUrl());
    } catch (error) {
      setConnection("offline", "无法连接");
      scheduleReconnect();
      return;
    }
    state.socket = socket;

    socket.onopen = () => {
      state.backoff = 1000;
      state.lastMessageAtMs = Date.now();
      handshake();
      startHeartbeat();
    };
    socket.onmessage = (event) => {
      state.lastMessageAtMs = Date.now();
      handleMessage(event.data);
    };
    socket.onclose = () => {
      state.ready = false;
      state.initialized = false;
      stopHeartbeat();
      setConnection("offline", "已断开");
      updateComposerState();
      scheduleReconnect();
    };
    socket.onerror = () => {
      setConnection("offline", "连接错误");
    };
  }

  function scheduleReconnect() {
    const delay = state.backoff;
    state.backoff = Math.min(state.backoff * 2, MAX_BACKOFF_MS);
    setTimeout(() => {
      if (!state.socket || state.socket.readyState === WebSocket.CLOSED) connect();
    }, delay);
  }

  /// 心跳同时干两件事：让隧道/NAT 上的连接保持活跃，以及在页面被挂起后
  /// 尽早发现那条「看起来还开着、实际已经收不到任何东西」的死连接。
  function startHeartbeat() {
    stopHeartbeat();
    state.heartbeatTimer = setInterval(() => {
      if (!state.socket || state.socket.readyState !== WebSocket.OPEN) return;
      if (Date.now() - state.lastMessageAtMs > STALE_MS) {
        // 静默丢弃旧 socket：它的 onclose 会继续触发重连调度。
        const dead = state.socket;
        state.socket = null;
        try { dead.close(); } catch (error) { /* 已经断开 */ }
        setConnection("connecting", "重新连接…");
        connect();
        return;
      }
      send("ping", {});
    }, HEARTBEAT_MS);
  }

  function stopHeartbeat() {
    if (state.heartbeatTimer) clearInterval(state.heartbeatTimer);
    state.heartbeatTimer = null;
  }

  async function handshake() {
    const credentials = state.credentials;
    if (!credentials) {
      setConnection("connecting", "等待配对");
      showPairing();
      return;
    }
    try {
      const params = { protocolVersion: PROTOCOL_VERSION, client: { name: "k-coder-mobile", version: "0.1" } };
      if (state.accessToken && Date.now() < state.tokenExpiresAt - 30000) {
        params.accessToken = state.accessToken;
      } else {
        params.deviceId = credentials.deviceId;
        params.deviceSecret = credentials.deviceSecret;
      }
      const result = await call("initialize", params, { timeoutMs: 15000 });
      state.initialized = true;
      state.accessToken = result.accessToken || null;
      state.tokenExpiresAt = result.accessTokenExpiresAtMs || 0;
      send("initialized", {});
      state.ready = true;
      setConnection("online", "已连接");
      hideBanner();
      el("pairSection").classList.add("hidden");
      // 上一条连接退避期间留下的旧游标对服务端没有意义：订阅是按连接登记的，
      // 这里先清掉，避免重连后被服务端判成 forbidden 再去读快照的绕路。
      state.subscribed.clear();
      showThreads();
      await refreshThreads();
      if (state.activeThreadId) {
        await openThread(state.activeThreadId, true);
      }
    } catch (error) {
      const data = (error && error.data) || {};
      if (data.kind === "unauthorized") {
        clearCredentials();
        showPairing();
        showBanner("warning", "设备凭据已失效，请重新配对。");
        return;
      }
      setConnection("offline", "握手失败");
      notify(describeError(error));
    }
  }

  function handleMessage(raw) {
    let message;
    try {
      message = JSON.parse(raw);
    } catch (error) {
      return;
    }
    if (message.id !== undefined && message.id !== null && state.pending.has(message.id)) {
      const pending = state.pending.get(message.id);
      state.pending.delete(message.id);
      if (message.error) pending.reject(message.error);
      else pending.resolve(message.result);
      return;
    }
    if (message.method === "event") {
      handleEvent(message.params);
      return;
    }
    if (message.method === "resync_required") {
      showBanner("warning", "连接积压过多，正在重新同步…");
      const threadId = state.activeThreadId;
      if (threadId) openThread(threadId, true);
      return;
    }
  }

  // ---- 时间线模型 ----
  //
  // 时间线是一串有序条目，每个条目有一个稳定的 key：
  // - 用户/助手消息：`item:<itemId>`（快照与增量用的是同一个 item id）
  // - 工具卡片：`tool:<callId>`（快照投影里带着 callId，因此不会与增量重复）
  // - 文件变更：`change:<changeId>`
  //
  // 增量只改自己那一条：`text_delta` 追加到助手气泡的文本节点上，不重建整屏。
  // 这也是手机端能真正看到「逐字流出」的前提——此前每个分片都会清空并重建整个
  // 时间线，长会话在手机上既卡又看不出流式。

  const timelineState = { entries: [], nodes: new Map(), scheduled: false };

  function entryIndex(key) {
    for (let index = 0; index < timelineState.entries.length; index += 1) {
      if (timelineState.entries[index].key === key) return index;
    }
    return -1;
  }

  function findEntry(key) {
    const index = entryIndex(key);
    return index >= 0 ? timelineState.entries[index] : null;
  }

  function capText(value, limit) {
    const max = limit || MAX_ENTRY_CHARS;
    if (value.length <= max) return value;
    return "…（前面内容已省略）\n" + value.slice(-max);
  }

  function entryLimit(entry) {
    return entry && entry.kind === "tool" ? MAX_TOOL_CHARS : MAX_ENTRY_CHARS;
  }

  /// 新增或更新一条时间线条目。`patch.text` 只在给定时覆盖文本；
  /// 流式续写请用 `appendEntryText`，那是追加语义。
  function upsertEntry(key, patch) {
    let entry = findEntry(key);
    if (!entry) {
      entry = Object.assign({ key: key, kind: "note", text: "" }, patch);
      timelineState.entries.push(entry);
    } else {
      Object.assign(entry, patch);
    }
    scheduleSync();
    return entry;
  }

  function appendEntryText(key, delta) {
    if (!delta) return;
    const entry = findEntry(key);
    if (!entry) return;
    entry.text = capText(entry.text + delta, entryLimit(entry));
    scheduleSync();
  }

  function ensureEntry(key, kind) {
    let entry = findEntry(key);
    if (!entry) {
      entry = { key: key, kind: kind, text: "", tool: null, change: null };
      timelineState.entries.push(entry);
      scheduleSync();
    }
    return entry;
  }

  function removeEntry(key) {
    const index = entryIndex(key);
    if (index < 0) return;
    timelineState.entries.splice(index, 1);
    scheduleSync();
  }

  function timelineIsEmpty() {
    return timelineState.entries.length === 0;
  }

  function scheduleSync() {
    if (timelineState.scheduled) return;
    timelineState.scheduled = true;
    requestAnimationFrame(() => {
      timelineState.scheduled = false;
      syncTimeline();
    });
  }

  /// 把模型文本同步到 DOM。`node.rendered` 记录上一次真正写进 DOM 的内容，
  /// 这样续写时只需要 append 一个文本节点，而不是重写整个 textContent。
  function applyText(node, field, value) {
    const rendered = node.rendered[field];
    if (rendered === value) return;
    const target = node[field + "El"];
    if (!target) return;
    if (value.indexOf(rendered) === 0) {
      target.appendChild(document.createTextNode(value.slice(rendered.length)));
    } else {
      target.textContent = value;
    }
    node.rendered[field] = value;
  }

  function createNode(entry) {
    if (entry.kind === "user" || entry.kind === "agent" || entry.kind === "error" || entry.kind === "note") {
      const row = document.createElement("div");
      row.className = "msg " + (entry.kind === "user" ? "user" : "agent");
      const bubble = document.createElement("div");
      bubble.className = "bubble " + entry.kind;
      const textEl = document.createElement("span");
      bubble.appendChild(textEl);
      row.appendChild(bubble);
      return { el: row, bubbleEl: bubble, textEl: textEl, rendered: { text: "" } };
    }
    if (entry.kind === "tool") {
      const details = document.createElement("details");
      details.className = "tool";
      details.open = true;
      const summary = document.createElement("summary");
      const chevron = document.createElement("span");
      chevron.className = "chevron";
      chevron.textContent = "▶";
      const nameEl = document.createElement("span");
      nameEl.className = "tool-name";
      const stateEl = document.createElement("span");
      stateEl.className = "pill";
      summary.appendChild(chevron);
      summary.appendChild(nameEl);
      summary.appendChild(stateEl);
      const pre = document.createElement("pre");
      details.appendChild(summary);
      details.appendChild(pre);
      // 字段名沿用 `textEl`，这样 `applyText` 的「续写只 append」逻辑对工具输出同样生效。
      return { el: details, nameEl: nameEl, stateEl: stateEl, textEl: pre, rendered: { name: "", text: "" } };
    }
    if (entry.kind === "change") {
      const card = document.createElement("div");
      card.className = "change";
      const head = document.createElement("div");
      const files = document.createElement("div");
      files.className = "change-files";
      card.appendChild(head);
      card.appendChild(files);
      return { el: card, textEl: head, filesEl: files, rendered: { text: "", files: "" } };
    }
    const card = document.createElement("div");
    card.className = "todo-card";
    const heading = document.createElement("h2");
    heading.textContent = "任务清单";
    const list = document.createElement("div");
    card.appendChild(heading);
    card.appendChild(list);
  return { el: card, listEl: list, rendered: { todos: "" } };
  }

  function updateNode(node, entry) {
    if (entry.kind === "tool") {
      const tool = entry.tool || {};
      applyText(node, "name", toolLabel(tool.name));
      const label = TOOL_STATE_LABELS[tool.state] || tool.state || "";
      if (node.stateEl.textContent !== label) {
        node.stateEl.textContent = label;
        node.stateEl.className = "pill" + (tool.state === "running" || tool.state === "pending" ? " running" : "");
      }
      applyText(node, "text", entry.text || "");
      return;
    }
    if (entry.kind === "change") {
      const change = entry.change || {};
      const stats = (change.insertions || change.deletions)
        ? "（+" + (change.insertions || 0) + " / -" + (change.deletions || 0) + "）"
        : "";
      applyText(node, "text", "已修改 " + (change.fileCount || 0) + " 个文件" + stats);
      applyText(node, "files", (change.files || []).join("\n"));
      return;
    }
    if (entry.kind === "todo") {
      const signature = JSON.stringify(entry.todos || []);
      if (node.rendered.todos === signature) return;
      node.rendered.todos = signature;
      node.listEl.textContent = "";
      (entry.todos || []).forEach((todo) => {
        const line = document.createElement("div");
        line.className = "todo";
        line.dataset.status = todo.status || "";
        const mark = document.createElement("span");
        mark.className = "mark";
        mark.textContent = todo.status === "completed" ? "☑" : todo.status === "in_progress" ? "◐" : "☐";
        const text = document.createElement("span");
        text.textContent = todo.content || "";
        line.appendChild(mark);
        line.appendChild(text);
        node.listEl.appendChild(line);
      });
      return;
    }
    applyText(node, "text", entry.text || "");
    if (entry.kind === "agent") {
      node.bubbleEl.classList.toggle("streaming", state.streamingKey === entry.key);
    }
  }

  function syncTimeline() {
    const container = el("timeline");
    const alive = new Set();
    let anchor = null;
    timelineState.entries.forEach((entry) => {
      alive.add(entry.key);
      let node = timelineState.nodes.get(entry.key);
      if (!node) {
        node = createNode(entry);
        timelineState.nodes.set(entry.key, node);
      }
      updateNode(node, entry);
      const expected = anchor ? anchor.nextSibling : container.firstChild;
      if (node.el.parentNode !== container || expected !== node.el) {
        container.insertBefore(node.el, expected || null);
      }
      anchor = node.el;
    });
    timelineState.nodes.forEach((node, key) => {
      if (alive.has(key)) return;
      node.el.remove();
      timelineState.nodes.delete(key);
    });
    if (state.view !== "chat") return;
    followBottom();
  }

  function resetTimeline(entries) {
    timelineState.entries = entries || [];
    el("timeline").textContent = "";
    timelineState.nodes.clear();
    syncTimeline();
  }

  // ---- 滚动跟随 ----

  function nearBottom() {
    const scrolled = window.scrollY + window.innerHeight;
    return document.documentElement.scrollHeight - scrolled < 140;
  }

  function followBottom() {
    if (!state.follow) return;
    window.scrollTo(0, document.documentElement.scrollHeight);
  }

  // ---- 事件投影 ----

  const TOOL_STATE_LABELS = {
    pending: "排队中",
    running: "运行中",
    completed: "完成",
    failed: "失败",
    cancelled: "已取消",
  };

  const TOOL_VERBS = {
    run_command: "运行命令",
    read_file: "读取文件",
    list_directory: "列目录",
    search_repository: "搜索代码",
    apply_patch: "修改文件",
    write_file: "写入文件",
    update_plan: "更新计划",
    request_user_input: "向你提问",
    search_knowledge: "查阅知识库",
    recall_memory: "回忆记忆",
    plugin_skill_read: "读取技能",
  };

  function toolLabel(name) {
    if (!name) return "工具";
    const verb = TOOL_VERBS[name];
    return verb ? verb : name;
  }

  function messageText(message) {
    if (!message || !Array.isArray(message.content)) return "";
    return message.content.filter((block) => block.type === "text").map((block) => block.text).join("");
  }

  function textKey(itemId) {
    return "item:" + (itemId || "unknown");
  }

  function handleEvent(params) {
    if (!params) return;
    const threadId = params.threadId;
    if (!threadId) return;
    const deliverySeq = params.deliverySeq || 0;
    if (state.subscribed.has(threadId)) {
      state.subscribed.set(threadId, Math.max(state.subscribed.get(threadId) || 0, deliverySeq));
    }
    if (threadId !== state.activeThreadId) {
      const summary = state.threads.find((thread) => thread.id === threadId);
      if (summary) {
        if (params.type === "turn_started") summary.running = true;
        if (["turn_completed", "turn_failed", "turn_cancelled"].indexOf(params.type) >= 0) {
          summary.running = false;
        }
        if (params.type === "approval_requested") summary.pendingApprovals += 1;
        if (params.type === "approval_resolved") summary.pendingApprovals = Math.max(0, summary.pendingApprovals - 1);
        renderThreads();
      }
      return;
    }

    switch (params.type) {
      case "turn_started": {
        state.activeTurnId = params.turnId;
        state.streamingKey = null;
        if (state.thread) {
          state.thread.running = true;
          state.thread.activeTurnId = params.turnId;
        }
        const message = params.userMessage;
        const text = messageText(message);
        if (text) {
          // 用与快照相同的 key（`item:<messageId>`）落一条气泡，这样重读会话时
          // 同一条消息不会变成两条；本地乐观气泡随之退场。
          upsertEntry(textKey(message && message.id), { kind: "user", text: text });
          removeEntry("pending-user");
        }
        updateComposerState();
        renderChatMeta();
        break;
      }
      case "text_delta": {
        const key = textKey(params.itemId);
        const entry = ensureEntry(key, "agent");
        entry.kind = "agent";
        state.streamingKey = key;
        appendEntryText(key, params.delta);
        renderChatMeta();
        break;
      }
      case "text_reset": {
        const key = textKey(params.itemId);
        const entry = ensureEntry(key, "agent");
        entry.kind = "agent";
        entry.text = "";
        state.streamingKey = key;
        scheduleSync();
        renderChatMeta();
        break;
      }
      case "item_completed": {
        if (params.itemType === "agent_message" && state.streamingKey === textKey(params.itemId)) {
          state.streamingKey = null;
          scheduleSync();
        }
        break;
      }
      case "tool_queued":
      case "tool_started": {
        const call = params.call || {};
        const key = "tool:" + (call.id || params.itemId);
        const entry = ensureEntry(key, "tool");
        entry.kind = "tool";
        entry.tool = { callId: call.id || "", name: call.name || "", state: "running" };
        if (entry.text === undefined) entry.text = "";
        scheduleSync();
        break;
      }
      case "tool_output_delta": {
        const key = "tool:" + params.callId;
        const entry = ensureEntry(key, "tool");
        entry.kind = "tool";
        entry.tool = entry.tool || { callId: params.callId, name: "", state: "running" };
        appendEntryText(key, params.delta);
        break;
      }
      case "tool_completed": {
        const key = "tool:" + params.callId;
        const entry = ensureEntry(key, "tool");
        entry.kind = "tool";
        const success = !params.result || params.result.success !== false;
        entry.tool = {
          callId: params.callId,
          name: (entry.tool && entry.tool.name) || params.name || "",
          state: success ? "completed" : "failed",
        };
        if (params.result && params.result.output && entry.text.length < params.result.output.length) {
          entry.text = capText(params.result.output, MAX_TOOL_CHARS);
        }
        scheduleSync();
        break;
      }
      case "change_applied": {
        const changeSet = params.changeSet || {};
        const files = (changeSet.files || []).map((file) => file.path).filter(Boolean);
        const key = "change:" + (changeSet.id || Date.now());
        upsertEntry(key, {
          kind: "change",
          change: {
            changeId: changeSet.id || "",
            fileCount: files.length,
            files: files,
            insertions: changeSet.insertions || 0,
            deletions: changeSet.deletions || 0,
          },
        });
        break;
      }
      case "approval_requested":
        if (state.thread) {
          state.thread.pendingApprovals.push({
            requestId: params.request.id,
            toolCallId: params.request.toolCallId,
            toolName: params.request.toolName,
            reason: params.request.reason,
            risk: params.request.risk,
            createdAtMs: params.request.createdAtMs,
            paths: (params.request.preview && params.request.preview.files
              ? params.request.preview.files.map((file) => file.path) : []),
          });
        }
        renderApprovals();
        break;
      case "approval_resolved":
        if (state.thread) {
          state.thread.pendingApprovals = state.thread.pendingApprovals.filter(
            (approval) => approval.requestId !== params.requestId);
        }
        renderApprovals();
        break;
      case "user_input_requested":
        if (state.thread) {
          state.thread.pendingUserInputs.push({
            requestId: params.request.id,
            questions: params.request.questions || [],
            createdAtMs: params.request.createdAtMs,
          });
        }
        renderApprovals();
        break;
      case "user_input_resolved":
        if (state.thread) {
          state.thread.pendingUserInputs = state.thread.pendingUserInputs.filter(
            (request) => request.requestId !== params.requestId);
        }
        renderApprovals();
        break;
      case "turn_completed": {
        // 正文分片已经落在气泡里；终态消息是权威版本，只在两者不一致时覆盖，
        // 这样既不会丢正文，也不会把同一段话显示两遍。
        const text = messageText(params.message);
        if (text) {
          const key = state.streamingKey || textKey(params.message && params.message.id);
          const entry = ensureEntry(key, "agent");
          entry.kind = "agent";
          if (entry.text !== text) {
            entry.text = capText(text);
          }
        }
        finishTurn("completed");
        break;
      }
      case "turn_failed": {
        upsertEntry("error:" + (params.turnId || Date.now()), {
          kind: "error",
          text: params.message || "Turn 执行失败",
        });
        finishTurn("failed");
        break;
      }
      case "turn_cancelled":
        finishTurn("cancelled");
        break;
      case "turn_rejected":
        upsertEntry("error:" + (params.turnId || Date.now()), {
          kind: "error",
          text: params.message || "这条消息没有被接受",
        });
        finishTurn("failed");
        break;
      case "todo_updated": {
        const todos = params.todos || [];
        if (todos.length) upsertEntry("todos", { kind: "todo", todos: todos });
        else removeEntry("todos");
        break;
      }
      case "context_compacted":
        upsertEntry("compact:" + (params.itemId || Date.now()), { kind: "note", text: "上下文已压缩" });
        break;
      case "activity_status_changed": {
        const labels = {
          thinking: "思考中…",
          rate_limited: "等待重试…",
          responding: "正在回复…",
          running_tool: "执行工具…",
          awaiting_approval: "等待你的审批…",
          finalizing: "整理结果…",
        };
        state.activity = labels[params.status] || "";
        renderChatMeta();
        break;
      }
      case "provider_retry_waiting":
        state.activity = "等待重试…";
        renderChatMeta();
        break;
      case "provider_stream_retry":
        state.activity = "连接中断，重连中 " + (params.attempt ?? "?") + "/" + (params.maxAttempts ?? "?") + "…";
        renderChatMeta();
        break;
      default:
        break;
    }
  }

  function finishTurn(kind) {
    state.streamingKey = null;
    state.activity = "";
    if (state.thread) {
      state.thread.running = false;
      state.thread.activeTurnId = null;
    }
    state.activeTurnId = null;
    renderChatMeta();
    updateComposerState();
    scheduleSync();
    if (kind === "completed" && state.thread) {
      // Turn 结束后端会补一次持久化，稍晚拉取可以让手机与桌面完全一致。
      setTimeout(() => {
        if (state.view === "chat" && !state.thread.running) refreshThreadSnapshot();
      }, 1200);
    }
  }

  // ---- 渲染：会话与对话 ----

  /// 会话按项目分组后的展示结构。
  ///
  /// 分组依据是服务端下发的 `projectKey`，手机端不再自行推断归属——归属事实留在
  /// 服务端，这里只负责渲染。独立会话（`projectKey` 为空）单独归到最后。
  function groupThreads() {
    const groups = [];
    const byKey = new Map();
    const standalone = [];
    state.projects.forEach((project) => {
      const group = { key: project.key, name: project.name, threads: [], known: true };
      byKey.set(project.key, group);
      groups.push(group);
    });
    state.threads.forEach((thread) => {
      const key = thread.projectKey;
      if (!key) {
        standalone.push(thread);
        return;
      }
      let group = byKey.get(key);
      if (!group) {
        // 会话指向一个已从项目列表移除的项目：照常显示，但用键的末段当名字，
        // 免得整条会话因为项目被删而在手机上凭空消失。
        const name = (key.split("/").filter(Boolean).pop()) || key;
        group = { key: key, name: name + "（已移除）", threads: [], known: false };
        byKey.set(key, group);
        groups.push(group);
      }
      group.threads.push(thread);
    });
    return { groups: groups, standalone: standalone };
  }

  function threadButton(thread) {
    const button = document.createElement("button");
    button.className = "thread";
    const main = document.createElement("div");
    main.className = "grow";
    const title = document.createElement("div");
    title.className = "thread-title";
    title.textContent = thread.title || "(无标题)";
    const meta = document.createElement("div");
    meta.className = "thread-meta";
    meta.textContent = new Date(thread.updatedAtMs).toLocaleString();
    main.appendChild(title);
    main.appendChild(meta);
    const pills = document.createElement("div");
    pills.className = "row";
    if (thread.running) {
      const pill = document.createElement("span");
      pill.className = "pill running";
      pill.textContent = "运行中";
      pills.appendChild(pill);
    }
    if (thread.pendingApprovals > 0) {
      const pill = document.createElement("span");
      pill.className = "pill approval";
      pill.textContent = "待审批 " + thread.pendingApprovals;
      pills.appendChild(pill);
    }
    button.appendChild(main);
    button.appendChild(pills);
    button.addEventListener("click", () => openThread(thread.id, false));
    return button;
  }

  function projectGroup(group) {
    const expanded = !state.collapsedProjects.has(group.key);
    const wrapper = document.createElement("div");
    wrapper.className = "project";

    const head = document.createElement("div");
    head.className = "project-head";
    const toggle = document.createElement("button");
    toggle.className = "project-toggle";
    toggle.setAttribute("aria-expanded", expanded ? "true" : "false");
    const chevron = document.createElement("span");
    chevron.className = "chevron";
    chevron.textContent = "▶";
    const name = document.createElement("span");
    name.className = "project-name";
    name.textContent = group.name;
    toggle.appendChild(chevron);
    toggle.appendChild(name);
    toggle.addEventListener("click", () => {
      if (state.collapsedProjects.has(group.key)) state.collapsedProjects.delete(group.key);
      else state.collapsedProjects.add(group.key);
      renderThreads();
    });
    const count = document.createElement("span");
    count.className = "project-count";
    count.textContent = String(group.threads.length);
    head.appendChild(toggle);
    head.appendChild(count);
    wrapper.appendChild(head);

    if (!expanded) {
      const fold = document.createElement("div");
      fold.className = "project-fold";
      fold.style.padding = "0 2px";
      fold.textContent = "已折叠";
      wrapper.appendChild(fold);
      return wrapper;
    }

    const body = document.createElement("div");
    body.className = "project-body";
    if (!group.threads.length) {
      const empty = document.createElement("div");
      empty.className = "project-empty";
      // 这句话是这次修复的核心：项目存在但还没有会话，本身就是有效信息，
      // 而不是"这个项目不存在"。
      empty.textContent = "还没有会话";
      body.appendChild(empty);
    } else {
      group.threads.forEach((thread) => body.appendChild(threadButton(thread)));
    }
    wrapper.appendChild(body);
    return wrapper;
  }

  function renderThreads() {
    const list = el("threadList");
    list.textContent = "";
    const grouped = groupThreads();
    const hasProjects = grouped.groups.length > 0;
    if (!hasProjects && !grouped.standalone.length) {
      const empty = document.createElement("div");
      empty.className = "card muted";
      // 网关未授权或尚未打开过任何项目时给一句能指路的话，而不是让人以为手机坏了。
      empty.textContent = "还没有项目。请先在电脑端打开或添加项目。";
      list.appendChild(empty);
      return;
    }
    grouped.groups.forEach((group) => list.appendChild(projectGroup(group)));
    if (grouped.standalone.length) {
      // 独立会话不属于任何项目，单独一段，避免被误读成某个项目的会话。
      list.appendChild(projectGroup({
        key: "\u0000standalone",
        name: "独立会话",
        threads: grouped.standalone,
        known: true,
      }));
    }
  }

  function renderChatMeta() {
    const thread = state.thread;
    const running = !!(thread && thread.running);
    const turnState = el("turnState");
    turnState.textContent = running ? "运行中" : "空闲";
    turnState.className = "pill" + (running ? " running" : "");
    el("chatMeta").textContent = running
      ? (state.activity ? state.activity : "Turn " + (state.activeTurnId || thread.activeTurnId || ""))
      : "";
    composer.dataset.running = running ? "true" : "false";
  }

  /// 审批与提问卡片固定挂在时间线最前面，避免被后来的长正文推到屏幕外。
  function renderApprovals() {
    const container = el("timeline");
    const thread = state.thread;
    container.querySelectorAll("[data-approval]").forEach((node) => node.remove());
    if (!thread) return;
    const cards = [];
    (thread.pendingApprovals || []).forEach((approval) => cards.push(renderApproval(approval)));
    (thread.pendingUserInputs || []).forEach((request) => cards.push(renderUserInput(request)));
    cards.reverse().forEach((card) => container.insertBefore(card, container.firstChild));
  }

  function renderApproval(approval) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.approval = approval.requestId;
    const heading = document.createElement("h2");
    heading.textContent = "需要审批：" + toolLabel(approval.toolName);
    card.appendChild(heading);
    const reason = document.createElement("div");
    reason.className = "muted";
    reason.textContent = (approval.risk || "") + " · " + (approval.reason || "");
    card.appendChild(reason);
    if (approval.paths && approval.paths.length) {
      const paths = document.createElement("div");
      paths.className = "muted";
      paths.textContent = "涉及：" + approval.paths.join("、");
      card.appendChild(paths);
    }
    const actions = document.createElement("div");
    actions.className = "row";
    actions.style.marginTop = "8px";
    const approve = document.createElement("button");
    approve.className = "success";
    approve.textContent = "批准";
    approve.addEventListener("click", () => respondApproval(approval, "approved", approve));
    const reject = document.createElement("button");
    reject.className = "danger";
    reject.textContent = "拒绝";
    reject.addEventListener("click", () => respondApproval(approval, "rejected", reject));
    actions.appendChild(approve);
    actions.appendChild(reject);
    card.appendChild(actions);
    return card;
  }

  async function respondApproval(approval, action, button) {
    button.disabled = true;
    try {
      await call("approval/respond", {
        requestId: approval.requestId,
        action: action,
        toolCallId: approval.toolCallId,
        expectedCreatedAtMs: approval.createdAtMs,
      });
    } catch (error) {
      notify(describeError(error));
    } finally {
      button.disabled = false;
    }
  }

  function renderUserInput(input) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.approval = input.requestId;
    const heading = document.createElement("h2");
    heading.textContent = "需要你的回答";
    card.appendChild(heading);
    const answers = [];
    (input.questions || []).forEach((question) => {
      const field = document.createElement("div");
      field.className = "field";
      const label = document.createElement("label");
      label.textContent = question.question;
      field.appendChild(label);
      if (question.options && question.options.length) {
        const choice = document.createElement("div");
        choice.className = "choice";
        question.options.forEach((option) => {
          const button = document.createElement("button");
          button.textContent = option;
          button.addEventListener("click", () => {
            answers.push({ question: question.question, answer: option });
            button.className = "primary";
            submitUserInput(input, answers, button);
          });
          choice.appendChild(button);
        });
        field.appendChild(choice);
      } else {
        const textarea = document.createElement("textarea");
        textarea.rows = 2;
        field.appendChild(textarea);
        const confirm = document.createElement("button");
        confirm.textContent = "提交";
        confirm.addEventListener("click", () => {
          answers.push({ question: question.question, answer: textarea.value });
          submitUserInput(input, answers, confirm);
        });
        field.appendChild(confirm);
      }
      card.appendChild(field);
    });
    return card;
  }

  async function submitUserInput(input, answers, button) {
    button.disabled = true;
    try {
      await call("tool/requestUserInput/respond", {
        requestId: input.requestId,
        action: "answered",
        answers: answers,
        expectedCreatedAtMs: input.createdAtMs,
      });
    } catch (error) {
      notify(describeError(error));
    } finally {
      button.disabled = false;
    }
  }

  function updateComposerState() {
    const send = el("sendButton");
    const interrupt = el("interruptButton");
    const connected = state.ready && state.socket && state.socket.readyState === WebSocket.OPEN;
    const running = !!(state.thread && state.thread.running);
    send.disabled = !connected || !state.activeThreadId || running;
    interrupt.disabled = !connected || !state.activeThreadId || !running;
    input.disabled = !connected || !state.activeThreadId;
    if (!connected) input.placeholder = "离线：草稿会保留，连接恢复后才能发送";
    else input.placeholder = "给 k-Coder 发消息…";
    renderChatMeta();
  }

  // ---- 视图切换 ----

  function showPairing() {
    state.view = "pairing";
    el("pairSection").classList.remove("hidden");
    el("threadsSection").classList.add("hidden");
    el("chatSection").classList.add("hidden");
    el("composer").classList.add("hidden");
    readPairingFragment();
  }

  function showThreads() {
    state.view = "threads";
    el("pairSection").classList.add("hidden");
    el("threadsSection").classList.remove("hidden");
    el("chatSection").classList.add("hidden");
    el("composer").classList.add("hidden");
    el("title").textContent = "k-Coder";
  }

  function showChat() {
    state.view = "chat";
    el("pairSection").classList.add("hidden");
    el("threadsSection").classList.add("hidden");
    el("chatSection").classList.remove("hidden");
    el("composer").classList.remove("hidden");
    measureHeader();
    measureComposer();
    resizeInput();
    updateComposerState();
  }

  async function refreshThreads() {
    if (!state.ready) return;
    try {
      // 两个请求并发：项目清单变化很慢，但它决定分组骨架，缺了它会话会先按
      // 未知归属渲染一次再跳变。缺任一个都不影响另一个的展示。
      const [projects, threads] = await Promise.all([
        call("project/list", {}),
        call("thread/list", {}),
      ]);
      state.projects = projects.projects || [];
      state.threads = threads.threads || [];
      renderThreads();
    } catch (error) {
      // 项目清单是分组骨架，但它不该决定会话能不能看：单独降级重取一次会话，
      // 让「项目列表读不到」表现为分组缺失，而不是整个列表白屏。
      try {
        const threads = await call("thread/list", {});
        state.projects = [];
        state.threads = threads.threads || [];
        renderThreads();
        notify("项目列表读取失败，已按独立会话展示");
      } catch (fallbackError) {
        notify(describeError(error || fallbackError));
      }
    }
  }

  /// 用服务端快照重建时间线。已经流出的本地正文按 item id 与快照合并：
  /// 快照里已有的条目以快照为准，快照还没落盘的（例如正在生成的那条）保留本地内容。
  function applyThreadSnapshot(thread) {
    const entries = [];
    const seen = new Set();
    (thread.turns || []).forEach((turn) => {
      if (turn.error) {
        entries.push({ key: "turn-error:" + turn.id, kind: "error", text: turn.error });
      }
      (turn.items || []).forEach((item) => {
        const kind = item.kind;
        if (kind === "user_message" || kind === "agent_message") {
          const text = item.text || "";
          if (!text.trim()) return;
          const key = textKey(item.id);
          seen.add(key);
          const existing = findEntry(key);
          entries.push({
            key: key,
            kind: kind === "user_message" ? "user" : "agent",
            text: text.length >= ((existing && existing.text) || "").length ? text : existing.text,
          });
          return;
        }
        if (kind === "tool") {
          const tool = item.tool || {};
          const key = "tool:" + (tool.callId || item.id);
          seen.add(key);
          entries.push({
            key: key,
            kind: "tool",
            text: tool.excerpt || "",
            tool: { callId: tool.callId || "", name: tool.name || "", state: tool.state || "completed" },
          });
          return;
        }
        if (kind === "change") {
          const change = item.change || {};
          const key = "change:" + (change.changeId || item.id);
          seen.add(key);
          entries.push({
            key: key,
            kind: "change",
            change: {
              changeId: change.changeId || "",
              fileCount: change.fileCount || 0,
              files: (change.files || []).map((file) => file.path).filter(Boolean),
              insertions: change.insertions || 0,
              deletions: change.deletions || 0,
            },
          });
        }
        // 其余类别（event / approval / user_input / context_compaction）由独立的卡片
        // 或事件承担，这里不再渲染空壳气泡。
      });
    });
    timelineState.entries.forEach((entry) => {
      if (seen.has(entry.key)) return;
      if (entry.kind !== "agent" && entry.kind !== "tool") return;
      // 本地正在流式生成、快照里还没有的内容：保留下来，放在末尾。
      entries.push(entry);
      seen.add(entry.key);
    });
    const todos = (state.thread && state.thread.todos) || [];
    if (todos.length) entries.push({ key: "todos", kind: "todo", todos: todos });
    resetTimeline(entries);
    renderApprovals();
  }

  async function openThread(threadId, forceReload) {
    if (state.activeThreadId !== threadId) state.streamingKey = null;
    state.activeThreadId = threadId;
    try {
      if (!state.subscribed.has(threadId) || forceReload) {
        const subscribed = await call("thread/subscribe", { threadId: threadId });
        state.subscribed.set(threadId, subscribed.deliverySeq || 0);
      }
      const result = await call("thread/read", { threadId: threadId });
      state.thread = Object.assign(
        { toolCalls: [], changes: [], pendingApprovals: [], pendingUserInputs: [], todos: [], turns: [] },
        result.thread,
      );
      state.activeTurnId = state.thread.activeTurnId || null;
      state.activity = "";
      if (state.activeTurnId) state.streamingKey = state.streamingKey || null;
      el("title").textContent = state.thread.title || "会话";
      el("chatTitle").textContent = state.thread.title || "会话";
      showChat();
      applyThreadSnapshot(state.thread);
      renderChatMeta();
    } catch (error) {
      notify(describeError(error));
    }
  }

  /// 轻量刷新：只重读当前会话，不动订阅游标。
  async function refreshThreadSnapshot() {
    const threadId = state.activeThreadId;
    if (!threadId || !state.ready) return;
    try {
      const result = await call("thread/read", { threadId: threadId });
      state.thread = Object.assign({}, state.thread, result.thread);
      state.activeTurnId = state.thread.activeTurnId || null;
      applyThreadSnapshot(state.thread);
      renderChatMeta();
    } catch (error) {
      // 静默失败：用户可以用 ↻ 手动重试。
    }
  }

  async function sendMessage() {
    const value = input.value.trim();
    if (!value || !state.activeThreadId) return;
    if (!state.ready) {
      notify("尚未连接到电脑，草稿已保留");
      return;
    }
    el("sendButton").disabled = true;
    try {
      const result = await call("turn/start", {
        threadId: state.activeThreadId,
        input: value,
        requestId: nextRequestId(),
      });
      state.activeTurnId = result.turnId;
      if (state.thread) {
        state.thread.running = true;
        state.thread.activeTurnId = result.turnId;
      }
      upsertEntry("pending-user", { kind: "user", text: value });
      input.value = "";
      resizeInput();
      state.draft = "";
      renderChatMeta();
      updateComposerState();
    } catch (error) {
      notify(describeError(error));
    } finally {
      updateComposerState();
    }
  }

  async function interruptTurn() {
    if (!state.activeThreadId || !state.activeTurnId) return;
    try {
      await call("turn/interrupt", {
        threadId: state.activeThreadId,
        turnId: state.activeTurnId,
        requestId: nextRequestId(),
      });
    } catch (error) {
      notify(describeError(error));
    }
  }

  // ---- 配对 ----

  function readPairingFragment() {
    const fragment = location.hash.replace(/^#/, "");
    if (!fragment) {
      el("pairHint").textContent = "没有检测到配对链接。请在电脑端重新生成二维码后扫描。";
      el("pairButton").disabled = true;
      return;
    }
    const params = new URLSearchParams(fragment);
    const challenge = params.get("c") || "";
    const parts = challenge.split(".");
    if (parts.length !== 2) {
      el("pairHint").textContent = "配对链接无效，请在电脑端重新生成。";
      el("pairButton").disabled = true;
      return;
    }
    state.pairing = { challengeId: parts[0], challengeSecret: parts[1] };
    el("pairHint").textContent = "输入电脑屏幕上显示的 6 位校验码后提交，等待电脑确认。";
    el("pairButton").disabled = false;
  }

  async function submitPairing() {
    if (!state.pairing) return;
    const deviceName = el("deviceName").value.trim() || "手机";
    const code = el("pairCode").value.trim();
    if (code.length !== 6) {
      showBanner("warning", "请输入 6 位校验码。");
      return;
    }
    el("pairButton").disabled = true;
    try {
      const response = await fetch("/pair", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          challengeId: state.pairing.challengeId,
          challengeSecret: state.pairing.challengeSecret,
          code: code,
          deviceName: deviceName,
          platform: navigator.userAgent,
        }),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        showBanner("error", payload.message || "配对失败");
        el("pairButton").disabled = false;
        return;
      }
      el("pairProgress").textContent = "已提交，等待电脑端确认…";
      pollPairing(payload.pendingId);
    } catch (error) {
      showBanner("error", "无法连接电脑：" + error.message);
      el("pairButton").disabled = false;
    }
  }

  function pollPairing(pendingId) {
    if (state.pairingTimer) clearInterval(state.pairingTimer);
    state.pairingTimer = setInterval(async () => {
      try {
        const response = await fetch("/pair/status", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            pendingId: pendingId,
            challengeSecret: state.pairing.challengeSecret,
          }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          clearInterval(state.pairingTimer);
          showBanner("error", payload.message || "配对状态查询失败");
          el("pairButton").disabled = false;
          return;
        }
        if (payload.status === "approved") {
          clearInterval(state.pairingTimer);
          saveCredentials({
            deviceId: payload.deviceId,
            deviceSecret: payload.deviceSecret,
            refreshToken: payload.refreshToken,
          });
          el("pairProgress").textContent = "配对成功，正在连接…";
          history.replaceState(null, "", location.pathname);
          connect();
        } else if (payload.status === "denied") {
          clearInterval(state.pairingTimer);
          showBanner("warning", "电脑端拒绝了这次配对。");
          el("pairButton").disabled = false;
        }
      } catch (error) {
        // 网络抖动：继续轮询。
      }
    }, 1500);
  }

  // ---- 输入区尺寸 ----

  function resizeInput() {
    // 空草稿交回 CSS 的默认行高：面板隐藏时 `scrollHeight` 会读到 0，
    // 写死高度会让输入框塌成一条 20px 的细线。
    if (!input.value) {
      input.style.height = "";
      return;
    }
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 132) + "px";
  }

  function measureComposer() {
    const height = composer.classList.contains("hidden") ? 0 : composer.offsetHeight;
    document.documentElement.style.setProperty("--composer-h", height + "px");
  }

  /// 会话工具条吸在顶部栏下方，偏移量按真实测量而不是写死高度。
  function measureHeader() {
    const header = document.querySelector("header");
    if (!header) return;
    document.documentElement.style.setProperty("--header-h", header.offsetHeight + "px");
  }

  // ---- 启动 ----

  el("pairButton").addEventListener("click", submitPairing);
  el("refreshThreads").addEventListener("click", refreshThreads);
  el("sendButton").addEventListener("click", sendMessage);
  el("interruptButton").addEventListener("click", interruptTurn);
  el("reloadThread").addEventListener("click", () => {
    if (state.activeThreadId) openThread(state.activeThreadId, true);
  });
  el("backToThreads").addEventListener("click", () => {
    state.activeThreadId = null;
    showThreads();
    refreshThreads();
  });
  input.addEventListener("input", () => {
    state.draft = input.value;
    resizeInput();
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
      event.preventDefault();
      sendMessage();
    }
  });
  window.addEventListener("online", () => connect());
  window.addEventListener("scroll", () => {
    state.follow = nearBottom();
  }, { passive: true });
  window.addEventListener("resize", () => {
    measureHeader();
    measureComposer();
  });
  document.addEventListener("visibilitychange", () => {
    measureComposer();
    if (document.visibilityState !== "visible") return;
    if (!state.socket || state.socket.readyState !== WebSocket.OPEN) {
      connect();
      return;
    }
    // 页面被系统挂起期间，socket 可能已经收不到任何东西但状态还是 OPEN。
    if (Date.now() - state.lastMessageAtMs > STALE_MS) {
      reconnectNow();
      return;
    }
    send("ping", {});
    if (state.activeThreadId) refreshThreadSnapshot();
  });

  // 手机浏览器在同一文档内只改 hash 时不会重新加载页面。如果用户在已打开
  // /m/ 的标签页里点开配对链接，启动时的片段解析不会再跑一次，页面会停在
  // 「没有检测到配对链接」。这里补一次解析，未配对时才接管界面。
  window.addEventListener("hashchange", () => {
    if (state.credentials) return;
    readPairingFragment();
  });

  if (typeof ResizeObserver === "function") {
    new ResizeObserver(measureComposer).observe(composer);
  }

  state.credentials = loadCredentials();
  measureHeader();
  measureComposer();
  resizeInput();
  if (state.credentials) {
    connect();
  } else {
    showPairing();
    setConnection("offline", "未配对");
  }
})();
</script>
</body>
</html>
