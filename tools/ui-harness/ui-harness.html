<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>k-Coder UI Harness</title>
    <script>
      // 开发期 UI 取证 harness：?theme=<id> 在首帧前写入主题，?standalone=1 模拟无工作区会话。
      (function () {
        var params = new URLSearchParams(location.search);
        var theme = params.get("theme");
        try {
          if (theme) localStorage.setItem("kcoder_theme", theme);
        } catch (_) {}
        var stored = theme || "light";
        var root = document.documentElement;
        root.setAttribute("data-skin", "codebuddy");
        root.setAttribute("data-theme", stored);
        root.setAttribute("data-theme-preference", stored);
      })();
    </script>
    <style>
      html, body { height: 100%; margin: 0; background: #f6f8f6; }
      #root { height: 100%; }
    </style>
    <script src="/tools/ui-harness/__ui-harness-mock.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
